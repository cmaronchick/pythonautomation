name: Daily Jira to Google Sheets Export

on:
  schedule:
    # Runs at 8:00 AM UTC every day. You can adjust the cron syntax for your timezone.
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows you to trigger it manually by clicking a button in GitHub

jobs:
  export_data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jira pandas openpyxl google-api-python-client google-auth-httplib2 google-auth-oauthlib httplib2 requests urllib3

      - name: Run Jira Export Script
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python ./jira/jira-extraction.py
      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com # Change if using Outlook/Office365
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Daily Jira Burndown & QA Metrics Updated"
          to: your-team-distro@company.com, product-manager@company.com
          from: GitHub Actions Automations
          body: |
            The daily Jira metrics have been successfully pulled and updated!
            
            You can view the latest Epic Burndown, Task Status, and Bug trends here:
            https://docs.google.com/spreadsheets/d/YOUR_FILE_ID/edit

