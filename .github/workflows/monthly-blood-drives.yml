name: Update Blood Drives

on:
  schedule:
    # Run at 8:00 AM Pacific on the first day of every month.
    # GitHub Actions cron uses UTC; this is 15:00 UTC during PDT.
    - cron: "0 15 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape Bloodworks Northwest
        run: python scraper.py

      - name: Generate website
        run: python generate_site.py

      - name: Commit updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/blood-drives.json docs/index.html
          git diff --cached --quiet || git commit -m "Update blood drives"
          git push
